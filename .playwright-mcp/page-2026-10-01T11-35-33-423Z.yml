          - paragraph [ref=f1e519]:
            - text: Jamming notes are
            - code [ref=f1e520]: G3
            - text: to
            - code [ref=f1e521]: C5
            - text: and are filtered to be in the default scale for the current chord.
          - heading "Switching scale while you play" [level=3] [ref=f1e522]
          - paragraph [ref=f1e523]: "The black keys in the left-hand octave are modifiers. While you hold a chord, the right-hand black keys switch the jam scale or transpose it:"
          - list [ref=f1e524]:
            - listitem [ref=f1e525]:
              - code [ref=f1e526]: C#
              - text: – default scale (
              - code [ref=f1e527]: scale1
