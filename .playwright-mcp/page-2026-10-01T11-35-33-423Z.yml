          - heading "Left-hand black key modifiers" [level=3] [ref=f1e538]
          - paragraph [ref=f1e539]:
            - text: The left-hand black keys act on the chord itself, with
            - code [ref=f1e540]: C#
            - text: "behaving like a SHIFT key:"
          - list [ref=f1e541]:
