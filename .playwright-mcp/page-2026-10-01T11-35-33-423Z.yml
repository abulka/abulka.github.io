                  - /url: https://abulka.github.io/tags/midi/
          - paragraph [ref=f1e428]: Become a master of playing complex chords by assigning them to a single note and triggering them with one finger. Jam (solo) over chord progressions in safety, because the notes that don’t fit are automatically filtered out. Import a MIDI file and OneKeyJam will find the chords inside it and lay them out across the keyboard so you can play along.
          - paragraph [ref=f1e429]: OneKeyJam is a browser-based MIDI app. Left-hand notes trigger whole chords with a single finger, and right-hand notes are snapped into the scale that fits the current chord, so everything you play sounds good. Change chord and the safe notes change with it. It can drive a real MIDI keyboard and DAW (for example Ableton), or make the sound in the browser.
          - paragraph [ref=f1e430]:
            - strong [ref=f1e431]:
              - link "Try it now at onekeyjam.netlify.app" [ref=f1e432] [cursor=pointer]:
                - /url: https://onekeyjam.netlify.app
            - text: · source code on
            - link "GitHub" [ref=f1e433] [cursor=pointer]:
              - /url: https://github.com/abulka/onekeyjam
          - paragraph [ref=f1e434]:
            - img "OneKeyJam screenshot" [ref=f1e435]
          - heading "What is OneKeyJam?" [level=2] [ref=f1e436]
          - paragraph [ref=f1e437]: "OneKeyJam is a MIDI jam station built around one simple idea: you shouldn’t need to know how to play a chord to play it. Assign a chord to a single note, press that note, and the chord plays. Then noodle around on the right-hand side of the keyboard and jam over it. Notes that don’t belong are quietly filtered out, so you can’t hit a wrong note."
          - paragraph [ref=f1e438]:
            - text: It’s a bit like the way a DAW plugin such as
            - link "Cthulhu" [ref=f1e439] [cursor=pointer]:
              - /url: https://xferrecords.com/products/cthulhu
            - text: works, but in your browser and with no setup. It’s great for songwriting, for practising improvisation, and for exploring chord progressions you wouldn’t normally reach for.
          - heading "Features" [level=2] [ref=f1e440]
          - list [ref=f1e441]:
            - listitem [ref=f1e442]:
              - strong [ref=f1e443]: Single-finger chords
              - text: – each left-hand key plays a full chord from your project. No chord shapes to learn.
            - listitem [ref=f1e444]:
              - strong [ref=f1e445]: Scale filtering
              - text: – right-hand notes snap to the scale that fits the current chord, so improvisation always sounds right.
            - listitem [ref=f1e446]:
              - strong [ref=f1e447]: Black-key modifiers
              - text: – switch scale, transpose chords and turn filtering on or off while you play.
            - listitem [ref=f1e448]:
              - strong [ref=f1e449]: Real MIDI, or built-in sounds
              - text: – send notes to a DAW over the macOS IAC Driver (jam notes, chords and bass on separate channels), or use the bundled General MIDI sounds in the browser.
            - listitem [ref=f1e450]:
              - strong [ref=f1e451]: Projects you control
              - text: – configure chords and scales with JSON, save projects in your browser, and export or import them as files.
            - listitem [ref=f1e452]:
              - strong [ref=f1e453]: Ready-made demo projects
              - text: – open a featured project and start playing straight away.
            - listitem [ref=f1e454]:
              - strong [ref=f1e455]: Import MIDI files
              - text: – load a MIDI file and OneKeyJam finds the chords inside it, then assigns them across the keyboard so you can trigger each chord with one note and jam over it in key.
          - heading "Using the app" [level=2] [ref=f1e456]
          - list [ref=f1e457]:
            - listitem [ref=f1e458]:
              - text: Open the app and choose
              - strong [ref=f1e459]: File → Open Featured…
              - text: to load a demo project.
            - listitem [ref=f1e460]: Play the highlighted left-hand keys to trigger chords.
            - listitem [ref=f1e461]: Play anywhere to the right to jam – the notes are filtered to fit the chord.
            - listitem [ref=f1e462]: Use the black keys to switch scale or transpose.
          - paragraph [ref=f1e463]:
            - text: A guided tour is available from the
            - strong [ref=f1e464]: Start Tour
            - text: item in the menu. To build a project from an existing MIDI file, choose
            - strong [ref=f1e465]: File → Import MIDI file…
            - text: and OneKeyJam will detect the chords and lay them out on the keyboard.
          - heading "Screenshots" [level=2] [ref=f1e466]
          - paragraph [ref=f1e467]: "The perform view shows your chord table, with each chord mapped to a single left-hand trigger note, and a built-in sequencer where you can capture both the left-hand chords and the right-hand jam notes on separate tracks:"
          - paragraph [ref=f1e468]:
            - img "OneKeyJam sequencer" [ref=f1e469]
          - paragraph [ref=f1e470]: "The edit view is where you build projects. Pick chords from the circle of fifths, see which scales fit each chord, and import a MIDI file to auto-detect its chords:"
          - paragraph [ref=f1e471]:
            - img "OneKeyJam edit view" [ref=f1e472]
          - heading "Use a real MIDI keyboard" [level=2] [ref=f1e473]
          - paragraph [ref=f1e474]: Plug in a MIDI keyboard and Chrome connects to it automatically through the built-in Web MIDI support – no setup needed. Sound is made in the browser out of the box, and you can also route notes to a DAW or synth such as Ableton via the macOS IAC Driver.
          - img "An external MIDI keyboard connected to OneKeyJam" [ref=f1e475]
          - paragraph [ref=f1e476]:
            - text: MIDI needs a secure context, so the page must be served over HTTPS (or
            - code [ref=f1e477]: localhost
            - text: "). To send notes to Ableton (or another DAW) over the IAC Driver:"
          - list [ref=f1e478]:
            - listitem [ref=f1e479]:
              - text: enable the
              - strong [ref=f1e480]: IAC Driver
              - text: in macOS
              - strong [ref=f1e481]: Audio MIDI Setup
            - listitem [ref=f1e482]: "in Ableton, add a track with a synth that listens on the IAC Driver MIDI input, and use separate channels for each part:"
          - table [ref=f1e483]:
            - rowgroup [ref=f1e484]:
              - row [ref=f1e485]:
                - columnheader "Channel" [ref=f1e486]
                - columnheader "Part" [ref=f1e487]
